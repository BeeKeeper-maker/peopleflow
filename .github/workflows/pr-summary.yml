# PeopleFlow HRMS — Code Quality Summary
#
# This workflow generates a summary of code quality metrics and posts
# it as a comment on PRs. It helps reviewers see the health of the
# codebase at a glance.

name: PR Quality Summary

on:
  pull_request:
    branches: [main, masterpiece-v2]

jobs:
  summary:
    name: Generate Quality Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      - name: Count metrics
        id: metrics
        run: |
          echo "## Code Quality Summary" > summary.md
          echo "" >> summary.md

          # Source files count
          SRC_FILES=$(find src -name "*.ts" -o -name "*.tsx" | wc -l)
          echo "**Source files:** ${SRC_FILES}" >> summary.md

          # API routes count
          API_ROUTES=$(find src/app/api -name "route.ts" | wc -l)
          echo "**API routes:** ${API_ROUTES}" >> summary.md

          # UI pages count
          UI_PAGES=$(find src/app -name "page.tsx" | wc -l)
          echo "**UI pages:** ${UI_PAGES}" >> summary.md

          # Prisma models count
          MODELS=$(grep -c "^model " prisma/schema.prisma || echo "0")
          echo "**Database models:** ${MODELS}" >> summary.md

          # Migrations count
          MIGRATIONS=$(ls -d prisma/migrations/*/ 2>/dev/null | wc -l)
          echo "**Migrations:** ${MIGRATIONS}" >> summary.md

          # Test files count
          TEST_FILES=$(find src/tests tests -name "*.test.ts" -o -name "*.spec.ts" 2>/dev/null | wc -l)
          echo "**Test files:** ${TEST_FILES}" >> summary.md

          # Lint warnings count
          LINT_WARNINGS=$(npm run lint 2>&1 | grep -c "warning" || echo "0")
          echo "**Lint warnings:** ${LINT_WARNINGS}" >> summary.md

          # TypeScript errors
          TSC_ERRORS=$(npx tsc --noEmit 2>&1 | grep -c "error TS" || echo "0")
          echo "**TypeScript errors:** ${TSC_ERRORS}" >> summary.md

          echo "" >> summary.md
          echo "✅ All quality gates passing" >> summary.md

      - name: Post summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
