# PeopleFlow HRMS — CI/CD Pipeline
#
# This workflow runs on every push and PR to ensure code quality:
#   1. Lint (ESLint — 0 errors required)
#   2. TypeScript (tsc --noEmit — 0 errors required)
#   3. Prisma validate + generate
#   4. Unit tests (Vitest — all must pass)
#   5. Production build (Next.js — must succeed)
#
# On the main/masterpiece-v2 branch, a successful build also pushes
# the Docker image to the registry (future enhancement).
#
# The `ignoreBuildErrors: true` in next.config.ts was removed in Phase 1.1,
# so the build gate now catches TypeScript errors that were previously hidden.

name: CI Quality Gates

on:
  push:
    branches: [main, masterpiece-v2]
  pull_request:
    branches: [main, masterpiece-v2]

# Cancel in-progress runs for the same branch when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint + TypeCheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      NEXTAUTH_SECRET: "ci-test-secret-at-least-32-characters-long"
      NEXTAUTH_URL: "http://localhost:3000"
      PLATFORM_JWT_SECRET: "ci-platform-jwt-secret-at-least-32-chars"
      CRON_SECRET: "ci-cron-secret-16char"
      REDIS_URL: "redis://localhost:6379"
      REDIS_PASSWORD: "ci-redis-password"

    steps:
      # ── Checkout ──
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Setup Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── Install dependencies ──
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ── Prisma validate + generate ──
      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      # ── Lint (0 errors required, warnings OK) ──
      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      # ── TypeScript check (0 errors required) ──
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ── Unit tests ──
      - name: Run unit tests
        run: npm test
        env:
          CI: "true"

      # ── Production build ──
      - name: Build production bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # ── Upload build artifact (for inspection) ──
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: .next/
          retention-days: 7

  # ── Security audit (non-blocking) ──
  security-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Run npm audit (all deps)
        run: npm audit --audit-level=high
        continue-on-error: true
