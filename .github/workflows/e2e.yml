# PeopleFlow HRMS — E2E Tests
#
# Runs Playwright E2E tests on every PR to main/masterpiece-v2.
# E2E tests require a running app server + database, so this is a
# separate job from the quality gates.
#
# Currently the E2E suite covers:
#   - Auth boundary (login, register, forgot password)
#   - Navigation (all roles)
#   - API boundary (public vs protected)
#   - Employee onboarding workflow
#   - Payroll + attendance workflow
#   - Security (cross-tenant, manager IDOR)
#   - Mobile ESS
#
# Future: add a seeded disposable database for full workflow E2E.

name: E2E Tests

on:
  pull_request:
    branches: [main, masterpiece-v2]
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      NEXTAUTH_SECRET: "e2e-test-secret-at-least-32-characters-long"
      NEXTAUTH_URL: "http://localhost:3000"
      PLATFORM_JWT_SECRET: "e2e-platform-jwt-secret-at-least-32-chars"
      CRON_SECRET: "e2e-cron-secret-16char"
      REDIS_URL: "redis://localhost:6379"
      REDIS_PASSWORD: "e2e-redis-password"
      RATE_LIMIT_AUTH_MAX: "1000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build production app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start production server
        run: |
          npm run start &
          sleep 5
          curl -s http://localhost:3000/api/health | grep -q "healthy" || exit 1

      - name: Run E2E tests (no-server config)
        run: npm run test:e2e:no-server -- --project=chromium
        env:
          CI: "true"

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
