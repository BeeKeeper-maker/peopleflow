# PeopleFlow HRMS - Docker Compose
# Enterprise B2B SaaS — Production-ready with Redis

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://peopleflow:${POSTGRES_PASSWORD:-peopleflow}@db:5432/peopleflow
      - REDIS_URL=redis://:${REDIS_PASSWORD:-peopleflow-redis}@redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - PLATFORM_JWT_SECRET=${PLATFORM_JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - SENTRY_DSN=${SENTRY_DSN}
      - PLATFORM_ADMIN_EMAIL=${PLATFORM_ADMIN_EMAIL:-platform@peopleflow.app}
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── BullMQ Worker (scales independently) ──
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run worker
    environment:
      - DATABASE_URL=postgresql://peopleflow:${POSTGRES_PASSWORD:-peopleflow}@db:5432/peopleflow
      - REDIS_URL=redis://:${REDIS_PASSWORD:-peopleflow-redis}@redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - PLATFORM_JWT_SECRET=${PLATFORM_JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-noreply@peopleflow.app}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1  # Scale up: docker-compose up --scale worker=3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peopleflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peopleflow}
      POSTGRES_DB: peopleflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peopleflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:-peopleflow-redis}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-peopleflow-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
